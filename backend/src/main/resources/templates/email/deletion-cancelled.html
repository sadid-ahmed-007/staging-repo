<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { background-color: #0052cc; color: #ffffff; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 30px; }
        .footer { background-color: #f8fafc; padding: 15px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #0052cc; color: #ffffff; text-decoration: none; border-radius: 4px; margin-top: 15px; }
        .code { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #0052cc; text-align: center; margin: 20px 0; display: block; }
        .alert { background-color: #fee2e2; border-left: 4px solid #ef4444; padding: 15px; margin: 20px 0; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EduAuth Registry</h1>
        </div>
        <div class="content">
            <p>Hello {{name}},</p><p>Your deletion request has been cancelled. Your account is fully restored and active.</p>
        </div>
        <div class="footer">
            &copy; 2026 EduAuth Registry. All rights reserved.<br>
            If you did not expect this email, please contact support.
        </div>
    </div>
</body>
</html>
